<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Quota Overlay</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="p-0 m-0 select-none overflow-hidden" data-tauri-drag-region>
  <div class="overlay-container relative w-full h-full" data-tauri-drag-region>

    <!-- Main Content Area: Left-justified gauges on top, flush stats / settings on bottom -->
    <main class="flex-1 flex flex-col justify-start w-full h-full overflow-hidden" data-tauri-drag-region>
      <!-- Gauges & stats container dynamically populated by app.js -->
      <div id="quota-content" class="flex-1 flex flex-col justify-between w-full" data-tauri-drag-region>
        <!-- Initial Loading Animation -->
        <div class="flex items-center justify-center h-[56px] w-full px-4">
          <div class="flex items-center gap-3">
            <div class="relative w-8 h-8 flex items-center justify-center">
              <svg class="w-8 h-8 animate-spin text-cyan-400" viewBox="0 0 36 36">
                <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2.5" />
                <circle cx="18" cy="18" r="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="32 60" stroke-linecap="round" />
              </svg>
              <div class="absolute inset-0 flex items-center justify-center">
                <svg class="w-3.5 h-3.5 text-cyan-300 animate-pulse" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z" />
                </svg>
              </div>
            </div>
            <div class="flex flex-col justify-center">
              <span class="text-[11px] font-semibold font-mono text-neutral-200 tracking-wider">LOADING GAUGES</span>
              <div class="flex items-center gap-1 mt-0.5">
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400/60 animate-pulse" style="animation-delay: 150ms"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400/30 animate-pulse" style="animation-delay: 300ms"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Settings Panel Container -->
      <div id="settings-panel" class="settings-panel hidden w-full h-full overflow-y-auto"></div>

      <!-- Console Logs Panel Container -->
      <div id="logs-panel" class="logs-panel hidden w-full h-full flex flex-col overflow-hidden"></div>
    </main>

    <!-- Floating Chrome Overlay: Absolutely positioned over the window for menu & resize triangle -->
    <div id="chrome-overlay" class="chrome-overlay absolute inset-0 pointer-events-none z-50 overflow-visible">
      <!-- Top-Right Controls: [ ⋮ Menu ] -->
      <div class="window-controls-cluster absolute top-1.5 right-1.5 flex items-center pointer-events-auto">
        <div class="relative">
          <button id="btn-menu" title="Menu" class="p-1 rounded-md text-neutral-400 hover:text-white hover:bg-white/10 transition">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <circle cx="12" cy="5" r="1.75" />
              <circle cx="12" cy="12" r="1.75" />
              <circle cx="12" cy="19" r="1.75" />
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div id="menu-dropdown" class="menu-dropdown hidden">
            <!-- Settings Item -->
            <button id="btn-settings" class="menu-item">
              <svg class="w-3.5 h-3.5 text-cyan-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span class="flex-1 text-left font-medium">Settings</span>
            </button>

            <!-- Refresh Item -->
            <button id="btn-refresh" class="menu-item">
              <svg id="icon-refresh" class="w-3.5 h-3.5 text-emerald-400 shrink-0 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              <span class="flex-1 text-left">Refresh Quotas</span>
            </button>

            <!-- Console Logs Item -->
            <button id="btn-logs" class="menu-item">
              <svg class="w-3.5 h-3.5 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M4 19h16a2 2 0 002-2V7a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
              <span class="flex-1 text-left">Console Logs</span>
            </button>

            <!-- Divider -->
            <div class="border-t border-white/10 my-1"></div>

            <!-- Close Item -->
            <button id="btn-close" class="menu-item text-rose-400 hover:text-rose-200 hover:bg-rose-500/15">
              <svg class="w-3.5 h-3.5 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
              <span class="flex-1 text-left">Close</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Bottom-Right Window Resize Handle (Triangle / 6-dot grip) -->
      <div id="window-resize-handle" class="resize-handle absolute bottom-1 right-1 p-1 text-neutral-400 select-none pointer-events-auto cursor-nwse-resize" title="Drag to resize window">
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="20" cy="20" r="2" />
          <circle cx="14" cy="20" r="2" />
          <circle cx="20" cy="14" r="2" />
          <circle cx="8" cy="20" r="2" />
          <circle cx="14" cy="14" r="2" />
          <circle cx="20" cy="8" r="2" />
        </svg>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
